name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build site
        # -u root: the hugo image runs as uid 1000, which can't write to the
        # runner-owned workspace.
        run: docker compose run --rm -u root build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # PRs upload a preview version (gets a preview URL, doesn't touch
          # production); pushes to main deploy for real.
          command: ${{ github.event_name == 'pull_request' && 'versions upload' || 'deploy' }}
